version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: tfg_user
      POSTGRES_PASSWORD: tfg_password
      POSTGRES_DB: tfg_riego
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tfg_user:tfg_password@db:5432/tfg_riego
    depends_on:
      - db
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: